# 推送 v 开头的版本标签（如 v0.18.2）时，自动发布到 VS Code 插件市场。
# 用的是插件市场的「受信任的发布」（OIDC），不需要个人访问令牌。
name: 发布到插件市场

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查标签和 package.json 版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 和 package.json 里的版本 $v 不一致"
            exit 1
          fi

      - name: 打包并发布
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --no-dependencies
